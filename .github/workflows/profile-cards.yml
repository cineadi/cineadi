name: Update GitHub Profile Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Render profile cards
        uses: seijikohara/profile-cards-action@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: cineadi
          cards: overview,lifetime,contributions,composition,rhythm,languages
          output-dir: assets
          themes: light,dark
          commit: true
          commit-message: "chore(profile): refresh GitHub cards [skip ci]"
